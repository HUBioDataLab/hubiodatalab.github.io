{%- assign pr = include.project -%}
<article class="card">
  <a class="card-link" href="{{ pr.url | relative_url }}">
    <div class="card-media{% unless pr.image %} card-media-empty{% endunless %}">
      {%- if pr.image %}<img src="{{ pr.image | relative_url }}" alt="" loading="lazy">{% else %}{% include mark.html class="mark-placeholder" stroke="0.9" %}{% endif -%}
    </div>
    <div class="card-body">
      <p class="eyebrow">{{ pr.theme }}</p>
      <h3>{{ pr.title }}</h3>
      <p>{{ pr.summary }}</p>
    </div>
  </a>
</article>
