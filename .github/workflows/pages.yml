name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # Point url/baseurl at wherever this repo is published (lab site at the root, forks under /<repo>/).
      - name: Set url and baseurl
        run: |
          sed -i 's|^url:.*|url: "${{ steps.pages.outputs.origin }}"|; s|^baseurl:.*|baseurl: "${{ steps.pages.outputs.base_path }}"|' _config.yml
          grep -E '^(url|baseurl):' _config.yml
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
